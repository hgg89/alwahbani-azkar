<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071d18"><title>لوحة المشرف | الوهباني</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:radial-gradient(circle at 20% 0%,#164d40,#061411 55%,#020807);color:#fff;min-height:100vh}main{max-width:850px;margin:auto;padding:22px}.hero,.panel{background:#ffffff0d;border:1px solid #ffffff18;backdrop-filter:blur(18px);border-radius:28px;padding:22px;margin-bottom:16px;box-shadow:0 20px 60px #0006}.hero h1{margin:0 0 8px}.muted{color:#a9c5bd}.login{max-width:500px;margin:10vh auto}.input{width:100%;padding:15px;border:1px solid #ffffff22;background:#ffffff0c;color:#fff;border-radius:16px;margin:12px 0;font:inherit}.btn{border:0;border-radius:15px;padding:13px 17px;background:#d8b45b;color:#102019;font-weight:800;cursor:pointer}.danger{background:#8b3040;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.feature{display:flex;justify-content:space-between;align-items:center;padding:15px;border:1px solid #ffffff12;border-radius:18px;background:#ffffff08}.switch{width:52px;height:30px;border-radius:20px;background:#555;position:relative;cursor:pointer}.switch i{position:absolute;width:24px;height:24px;top:3px;right:3px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:#18a579}.switch.on i{right:25px}.row{display:flex;gap:10px;flex-wrap:wrap}.toast{position:fixed;bottom:18px;left:18px;right:18px;max-width:500px;margin:auto;background:#fff;color:#17352d;padding:14px;border-radius:15px;display:none;text-align:center}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<section id="login" class="hero login"><h1>🔐 لوحة المشرف</h1><p class="muted">الوهباني | أذكاري — منطقة محمية</p><input id="pass" class="input" type="password" placeholder="كلمة مرور المشرف" autocomplete="current-password"><button class="btn" onclick="login()">دخول آمن</button></section>
<section id="app" hidden><div class="hero"><h1>⚡ مركز التحكم</h1><p class="muted">تحكم في الميزات والرسائل من مكان واحد. الإعدادات لا تظهر للمستخدم العادي.</p></div>
<div class="panel"><h2>🎛️ الميزات</h2><div id="features" class="grid"></div></div>
<div class="panel"><h2>✍️ محتوى الواجهة</h2><label class="muted">العنوان الفرعي</label><input id="subtitle" class="input"><label class="muted">رسالة الترحيب داخل AI</label><textarea id="welcome" class="input" rows="4"></textarea><button class="btn" onclick="saveText()">حفظ التغييرات</button></div>
<div class="panel"><div class="row"><button class="btn" onclick="location.href='/'">🏠 فتح التطبيق</button><button class="btn danger" onclick="logout()">تسجيل الخروج</button></div></div>
</section></main><div id="toast" class="toast"></div>
<script>
let token=localStorage.getItem("wa_admin_token"),settings={};
const labels={ai:"🤖 الذكاء الاصطناعي",tasbih:"📿 عداد التسبيح",favorites:"❤️ المفضلة",search:"🔎 البحث",reminders:"🔔 التذكيرات",vibration:"📳 الاهتزاز",nightMode:"🌙 الوضع الليلي",fontControls:"🔤 التحكم بحجم الخط"};
async function login(){const p=document.getElementById("pass").value;const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})});const d=await r.json();if(!r.ok)return toast(d.error||"فشل الدخول");localStorage.setItem("wa_admin_token",d.token);token=d.token;showApp()}
async function showApp(){if(!token)return;const r=await fetch("/api/admin/settings",{headers:{Authorization:"Bearer "+token}});if(!r.ok){localStorage.removeItem("wa_admin_token");token=null;return}settings=await r.json();document.getElementById("login").hidden=true;document.getElementById("app").hidden=false;render()}
function render(){document.getElementById("features").innerHTML=Object.keys(labels).map(k=>'<div class="feature"><b>'+labels[k]+'</b><span class="switch '+(settings[k]?'on':'')+'" onclick="toggle(\''+k+'\')"><i></i></span></div>').join("");document.getElementById("subtitle").value=settings.subtitle||"";document.getElementById("welcome").value=settings.welcome||""}
async function toggle(k){settings[k]=!settings[k];await save({[k]:settings[k]})}
async function saveText(){await save({subtitle:document.getElementById("subtitle").value,welcome:document.getElementById("welcome").value})}
async function save(body){const r=await fetch("/api/admin/settings",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify(body)});if(!r.ok)return toast("انتهت الجلسة، سجّل الدخول مجددًا");settings=await r.json();render();toast("تم حفظ التغيير ✓")}
function logout(){localStorage.removeItem("wa_admin_token");location.reload()}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2200)}
showApp();
</script></body></html>
